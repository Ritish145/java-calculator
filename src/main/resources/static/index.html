<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #273449 0%,
                    #141922 45%,
                    #090c12 100%
                );

            color: white;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
        }

        .calculator {
            width: 360px;
            padding: 22px;
            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #222834,
                    #161b24
                );

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .calculator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #9ca8b9;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: #8f9bad;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3ddc84;

            box-shadow:
                0 0 10px rgba(61, 220, 132, 0.6);
        }

        .screen {
            min-height: 125px;
            padding: 18px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            margin-bottom: 18px;

            border-radius: 18px;

            background:
                linear-gradient(
                    160deg,
                    #080b10,
                    #10151d
                );

            border: 1px solid rgba(255, 255, 255, 0.06);

            overflow: hidden;
        }

        .expression {
            min-height: 24px;
            text-align: right;
            color: #747f91;
            font-size: 15px;
            margin-bottom: 8px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            text-align: right;

            font-size: 46px;
            font-weight: 300;

            padding: 0;
            letter-spacing: -1px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 11px;
        }

        button {
            position: relative;

            height: 68px;

            border: none;
            border-radius: 16px;

            font-size: 21px;
            font-weight: 500;

            cursor: pointer;

            color: white;

            transition:
                transform 0.08s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active,
        button.pressed {
            transform: scale(0.94);
        }

        .number {
            background: #303846;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .number:hover {
            background: #3a4454;
        }

        .function {
            background: #485161;
        }

        .function:hover {
            background: #586274;
        }

        .operator {
            background:
                linear-gradient(
                    145deg,
                    #ff9f1c,
                    #ff7b00
                );

            box-shadow:
                0 7px 18px rgba(255, 125, 0, 0.18);
        }

        .operator:hover {
            box-shadow:
                0 10px 25px rgba(255, 125, 0, 0.3);
        }

        .operator.active {
            background: white;
            color: #ff8400;
        }

        .equals {
            grid-column: span 2;

            background:
                linear-gradient(
                    145deg,
                    #36d46c,
                    #19a84b
                );

            box-shadow:
                0 7px 18px rgba(30, 190, 90, 0.2);
        }

        .equals:hover {
            box-shadow:
                0 10px 25px rgba(30, 190, 90, 0.32);
        }

        .clear {
            background:
                linear-gradient(
                    145deg,
                    #ff625e,
                    #d94343
                );
        }

        /* CSV EXPORT AREA */

        .export-area {
            margin-top: 16px;
        }

        .export-button {
            width: 100%;
            height: 50px;

            border-radius: 14px;

            font-size: 14px;
            font-weight: 600;

            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #2563eb
                );

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.22);
        }

        .export-button:hover {
            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .export-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .export-status {
            min-height: 18px;
            margin-top: 9px;

            text-align: center;

            color: #8f9bad;
            font-size: 11px;
        }

        .keyboard-hint {
            color: #7c8798;
            font-size: 12px;
            text-align: center;
            line-height: 1.6;

            padding: 0 15px;
        }

        .keyboard-hint strong {
            color: #b6bfcb;
            font-weight: 500;
        }

        @media (max-width: 450px) {

            .calculator {
                width: calc(100vw - 30px);
            }

            button {
                height: 62px;
            }

            .export-button {
                height: 50px;
            }

            .display {
                font-size: 40px;
            }
        }

    
        /* =========================================================
           AURORA GLASS AWS CALCULATOR THEME
           ========================================================= */

        body {
            position: relative;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.30), transparent 32%),
                radial-gradient(circle at 85% 25%, rgba(126, 34, 206, 0.28), transparent 34%),
                radial-gradient(circle at 50% 85%, rgba(59, 130, 246, 0.12), transparent 35%),
                linear-gradient(145deg, #030712, #080d1a 45%, #0b1020);
            background-attachment: fixed;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            filter: blur(105px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.38;
        }

        body::before {
            top: -150px;
            left: -120px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            animation: blueAurora 12s ease-in-out infinite alternate;
        }

        body::after {
            right: -140px;
            bottom: -150px;
            background: linear-gradient(135deg, #7c3aed, #c026d3);
            animation: purpleAurora 14s ease-in-out infinite alternate;
        }

        @keyframes blueAurora {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(170px, 100px) scale(1.18); }
        }

        @keyframes purpleAurora {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-150px, -100px) scale(1.15); }
        }

        .page {
            position: relative;
            z-index: 2;
            padding: 40px 15px;
        }

        .calculator {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.68), rgba(15, 23, 42, 0.72));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow:
                0 35px 90px rgba(0, 0, 0, 0.60),
                0 0 60px rgba(59, 130, 246, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .calculator::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 500px;
            top: -180px;
            left: -170px;
            transform: rotate(32deg);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            pointer-events: none;
        }

        .calculator:hover {
            transform: translateY(-5px);
            box-shadow:
                0 45px 110px rgba(0, 0, 0, 0.65),
                0 0 75px rgba(59, 130, 246, 0.15),
                0 0 35px rgba(124, 58, 237, 0.10);
        }

        .brand {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2.5px;
            background: linear-gradient(90deg, #93c5fd, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status { color: #aab6ca; }

        .status-dot {
            background: #22c55e;
            animation: awsPulse 1.8s ease-in-out infinite;
        }

        @keyframes awsPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(34, 197, 94, 0.6); }
            50% {
                box-shadow:
                    0 0 8px rgba(34, 197, 94, 0.9),
                    0 0 20px rgba(34, 197, 94, 0.6);
            }
        }

        .screen {
            position: relative;
            background: linear-gradient(160deg, rgba(2, 6, 15, 0.96), rgba(8, 15, 30, 0.92));
            border: 1px solid rgba(96, 165, 250, 0.13);
            box-shadow:
                inset 0 0 35px rgba(0, 0, 0, 0.55),
                0 15px 30px rgba(0, 0, 0, 0.25),
                0 0 20px rgba(59, 130, 246, 0.04);
        }

        .display {
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.10),
                0 0 35px rgba(96, 165, 250, 0.10);
        }

        .expression { color: #8291aa; }

        .number {
            background: linear-gradient(145deg, rgba(51, 65, 85, 0.92), rgba(30, 41, 59, 0.94));
            border: 1px solid rgba(255, 255, 255, 0.045);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 5px 14px rgba(0, 0, 0, 0.18);
        }

        .number:hover {
            background: linear-gradient(145deg, #475569, #334155);
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
        }

        .function {
            background: linear-gradient(145deg, #64748b, #475569);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .function:hover {
            background: linear-gradient(145deg, #75849b, #536177);
        }

        .operator {
            background: linear-gradient(145deg, #ff9d20, #f97316);
            box-shadow: 0 8px 22px rgba(249, 115, 22, 0.26);
        }

        .operator:hover {
            transform: translateY(-3px) scale(1.025);
            box-shadow: 0 13px 30px rgba(249, 115, 22, 0.40);
        }

        .operator.active {
            background: white;
            color: #f97316;
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.22);
        }

        .equals {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.28);
        }

        .equals:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 36px rgba(34, 197, 94, 0.42);
        }

        .clear {
            background: linear-gradient(135deg, #fb7185, #ef4444);
            box-shadow: 0 8px 22px rgba(239, 68, 68, 0.23);
        }

        .export-button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #2563eb, #7c3aed, #2563eb);
            background-size: 220% 100%;
            animation: downloadGradient 5s linear infinite;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.30);
        }

        @keyframes downloadGradient {
            from { background-position: 0% 50%; }
            to { background-position: 220% 50%; }
        }

        .export-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(124, 58, 237, 0.40);
        }

        .export-button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
            transform: skewX(-20deg);
            transition: left 0.55s ease;
        }

        .export-button:hover::after { left: 140%; }
        .export-status { color: #94a3b8; }
        .keyboard-hint { color: #77849a; opacity: 0.9; }
        .keyboard-hint strong { color: #cbd5e1; }

        @media (max-width: 450px) {
            body { align-items: flex-start; }
            .page { padding-top: 20px; padding-bottom: 30px; }
            .calculator {
                width: calc(100vw - 24px);
                padding: 19px;
                border-radius: 24px;
            }
            .screen { min-height: 115px; }
            button { height: 60px; }
            .export-button { height: 50px; }
            .display { font-size: 40px; }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="calculator">

        <div class="calculator-header">

            <div class="brand">
                JAVA CALC
            </div>

            <div class="status">
                <span class="status-dot"></span>
                AWS Live
            </div>

        </div>


        <div class="screen">

            <div
                id="expression"
                class="expression">
            </div>

            <input
                id="display"
                class="display"
                type="text"
                value="0"
                readonly
            >

        </div>


        <div class="buttons">

            <!-- ROW 1 -->

            <button
                class="clear"
                data-key="clear"
                onclick="clearCalculator()">
                AC
            </button>

            <button
                class="function"
                onclick="toggleSign()">
                ±
            </button>

            <button
                class="function"
                data-key="backspace"
                onclick="deleteNumber()">
                ⌫
            </button>

            <button
                class="operator"
                data-operation="divide"
                onclick="chooseOperation('divide', this)">
                ÷
            </button>


            <!-- ROW 2 -->

            <button
                class="number"
                data-number="0"
                onclick="enterNumber('0')">
                0
            </button>

            <button
                class="number"
                data-number="1"
                onclick="enterNumber('1')">
                1
            </button>

            <button
                class="number"
                data-number="2"
                onclick="enterNumber('2')">
                2
            </button>

            <button
                class="operator"
                data-operation="multiply"
                onclick="chooseOperation('multiply', this)">
                ×
            </button>


            <!-- ROW 3 -->

            <button
                class="number"
                data-number="3"
                onclick="enterNumber('3')">
                3
            </button>

            <button
                class="number"
                data-number="4"
                onclick="enterNumber('4')">
                4
            </button>

            <button
                class="number"
                data-number="5"
                onclick="enterNumber('5')">
                5
            </button>

            <button
                class="operator"
                data-operation="subtract"
                onclick="chooseOperation('subtract', this)">
                −
            </button>


            <!-- ROW 4 -->

            <button
                class="number"
                data-number="6"
                onclick="enterNumber('6')">
                6
            </button>

            <button
                class="number"
                data-number="7"
                onclick="enterNumber('7')">
                7
            </button>

            <button
                class="number"
                data-number="8"
                onclick="enterNumber('8')">
                8
            </button>

            <button
                class="operator"
                data-operation="add"
                onclick="chooseOperation('add', this)">
                +
            </button>


            <!-- ROW 5 -->

            <button
                class="number"
                data-number="9"
                onclick="enterNumber('9')">
                9
            </button>

            <button
                class="number"
                data-number="."
                onclick="enterNumber('.')">
                .
            </button>

            <button
                class="equals"
                data-key="equals"
                onclick="calculate()">
                =
            </button>

        </div>


        <!-- DOWNLOAD CSV -->

        <div class="export-area">

            <button
                id="exportButton"
                class="export-button"
                type="button"
                onclick="downloadRecords()">
                Download Records CSV
            </button>

            <div
                id="exportStatus"
                class="export-status">
            </div>

        </div>

    </div>


    <div class="keyboard-hint">

        Keyboard enabled:
        <strong>0–9</strong>,
        <strong>Numpad</strong>,
        <strong>+ − × ÷</strong>,
        <strong>Enter</strong>,
        <strong>Backspace</strong>,
        <strong>Esc</strong>

    </div>

</div>


<script>

    const display =
        document.getElementById("display");

    const expression =
        document.getElementById("expression");


    let firstNumber = null;
    let operation = null;
    let waitingForSecondNumber = false;
    let selectedOperatorButton = null;


    const operationSymbols = {
        add: "+",
        subtract: "−",
        multiply: "×",
        divide: "÷"
    };


    function enterNumber(number) {

        if (display.value === "Error") {
            display.value = "0";
        }

        if (waitingForSecondNumber) {

            display.value =
                number === "."
                    ? "0."
                    : number;

            waitingForSecondNumber = false;

            return;
        }

        if (
            number === "." &&
            display.value.includes(".")
        ) {
            return;
        }

        if (
            display.value === "0" &&
            number !== "."
        ) {

            display.value = number;

        } else {

            display.value += number;
        }
    }


    function chooseOperation(
        selectedOperation,
        button
    ) {

        firstNumber =
            parseFloat(display.value);

        operation =
            selectedOperation;

        waitingForSecondNumber =
            true;

        expression.textContent =
            `${formatNumber(firstNumber)} ${operationSymbols[operation]}`;

        clearOperatorHighlight();

        if (button) {

            button.classList.add("active");

            selectedOperatorButton =
                button;
        }
    }


    async function calculate() {

        if (
            firstNumber === null ||
            operation === null
        ) {
            return;
        }

        const secondNumber =
            parseFloat(display.value);

        const currentExpression =
            `${formatNumber(firstNumber)} ` +
            `${operationSymbols[operation]} ` +
            `${formatNumber(secondNumber)}`;

        try {

            const response =
                await fetch(
                    `/calculate` +
                    `?a=${encodeURIComponent(firstNumber)}` +
                    `&b=${encodeURIComponent(secondNumber)}` +
                    `&operation=${encodeURIComponent(operation)}`
                );

            if (!response.ok) {
                throw new Error("Calculation failed");
            }

            const result =
                await response.text();

            expression.textContent =
                `${currentExpression} =`;

            display.value =
                formatNumber(
                    parseFloat(result)
                );

            firstNumber = null;
            operation = null;
            waitingForSecondNumber = true;

            clearOperatorHighlight();

        } catch (error) {

            expression.textContent =
                currentExpression;

            display.value =
                "Error";

            firstNumber = null;
            operation = null;
            waitingForSecondNumber = true;

            clearOperatorHighlight();

            console.error(error);
        }
    }


    /*
     * NEW:
     * Export calculation history from RDS,
     * upload it to S3,
     * and open the temporary S3 download URL.
     */
    async function downloadRecords() {

        const button =
            document.getElementById("exportButton");

        const status =
            document.getElementById("exportStatus");

        try {

            button.disabled = true;

            button.textContent =
                "Preparing CSV...";

            status.textContent =
                "Reading records and creating report...";


            const response =
                await fetch(
                    "/reports/export/csv",
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Export failed with status ${response.status}`
                );
            }


            const data =
                await response.json();


            if (!data.downloadUrl) {

                throw new Error(
                    "Download URL was not returned."
                );
            }


            status.textContent =
                `${data.recordCount} records exported. Download starting...`;


            /*
             * The S3 bucket stays private.
             * The backend gives the browser a temporary
             * presigned URL for this specific CSV.
             */
            window.location.href =
                data.downloadUrl;


            setTimeout(() => {

                status.textContent =
                    `${data.recordCount} records exported successfully.`;

            }, 1500);


        } catch (error) {

            console.error(
                "CSV export error:",
                error
            );

            status.textContent =
                "Could not download records.";

            alert(
                "CSV export failed. Please try again."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Download Records CSV";
        }
    }


    function clearCalculator() {

        display.value = "0";

        expression.textContent = "";

        firstNumber = null;
        operation = null;
        waitingForSecondNumber = false;

        clearOperatorHighlight();
    }


    function deleteNumber() {

        if (
            display.value === "Error" ||
            waitingForSecondNumber
        ) {

            display.value = "0";

            waitingForSecondNumber = false;

            return;
        }

        if (display.value.length <= 1) {

            display.value = "0";

            return;
        }

        display.value =
            display.value.slice(0, -1);
    }


    function toggleSign() {

        const number =
            parseFloat(display.value);

        if (
            Number.isNaN(number) ||
            number === 0
        ) {
            return;
        }

        display.value =
            formatNumber(
                number * -1
            );
    }


    function clearOperatorHighlight() {

        document
            .querySelectorAll(".operator")
            .forEach(button => {

                button.classList.remove(
                    "active"
                );
            });

        selectedOperatorButton = null;
    }


    function formatNumber(number) {

        if (!Number.isFinite(number)) {
            return "Error";
        }

        if (Number.isInteger(number)) {
            return number.toString();
        }

        return parseFloat(
            number.toFixed(10)
        ).toString();
    }


    function flashButton(selector) {

        const button =
            document.querySelector(selector);

        if (!button) {
            return;
        }

        button.classList.add("pressed");

        setTimeout(() => {

            button.classList.remove(
                "pressed"
            );

        }, 100);
    }


    function keyboardOperation(
        selectedOperation
    ) {

        const button =
            document.querySelector(
                `[data-operation="${selectedOperation}"]`
            );

        chooseOperation(
            selectedOperation,
            button
        );

        flashButton(
            `[data-operation="${selectedOperation}"]`
        );
    }


    document.addEventListener(
        "keydown",
        function(event) {

            let handled = true;


            if (
                event.code.startsWith(
                    "Numpad"
                )
            ) {

                const numpadMap = {
                    Numpad0: "0",
                    Numpad1: "1",
                    Numpad2: "2",
                    Numpad3: "3",
                    Numpad4: "4",
                    Numpad5: "5",
                    Numpad6: "6",
                    Numpad7: "7",
                    Numpad8: "8",
                    Numpad9: "9"
                };


                if (
                    numpadMap[event.code]
                    !== undefined
                ) {

                    const number =
                        numpadMap[event.code];

                    enterNumber(number);

                    flashButton(
                        `[data-number="${number}"]`
                    );

                } else if (
                    event.code ===
                    "NumpadDecimal"
                ) {

                    enterNumber(".");

                    flashButton(
                        `[data-number="."]`
                    );

                } else if (
                    event.code ===
                    "NumpadAdd"
                ) {

                    keyboardOperation("add");

                } else if (
                    event.code ===
                    "NumpadSubtract"
                ) {

                    keyboardOperation("subtract");

                } else if (
                    event.code ===
                    "NumpadMultiply"
                ) {

                    keyboardOperation("multiply");

                } else if (
                    event.code ===
                    "NumpadDivide"
                ) {

                    keyboardOperation("divide");

                } else if (
                    event.code ===
                    "NumpadEnter"
                ) {

                    calculate();

                    flashButton(
                        '[data-key="equals"]'
                    );

                } else {

                    handled = false;
                }

            } else if (
                /^[0-9]$/.test(
                    event.key
                )
            ) {

                enterNumber(
                    event.key
                );

                flashButton(
                    `[data-number="${event.key}"]`
                );

            } else if (
                event.key === "."
            ) {

                enterNumber(".");

                flashButton(
                    `[data-number="."]`
                );

            } else if (
                event.key === "+"
            ) {

                keyboardOperation("add");

            } else if (
                event.key === "-"
            ) {

                keyboardOperation("subtract");

            } else if (
                event.key === "*"
            ) {

                keyboardOperation("multiply");

            } else if (
                event.key === "/"
            ) {

                keyboardOperation("divide");

            } else if (
                event.key === "Enter" ||
                event.key === "="
            ) {

                calculate();

                flashButton(
                    '[data-key="equals"]'
                );

            } else if (
                event.key === "Backspace"
            ) {

                deleteNumber();

                flashButton(
                    '[data-key="backspace"]'
                );

            } else if (
                event.key === "Escape" ||
                event.key === "Delete"
            ) {

                clearCalculator();

                flashButton(
                    '[data-key="clear"]'
                );

            } else {

                handled = false;
            }


            if (handled) {
                event.preventDefault();
            }
        }
    );

</script>

</body>

</html>
