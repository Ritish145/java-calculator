<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #273449 0%,
                    #141922 45%,
                    #090c12 100%
                );

            color: white;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .calculator {
            width: 360px;

            padding: 22px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #222834,
                    #161b24
                );

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .calculator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .brand {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;

            color: #9ca8b9;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 11px;
            color: #8f9bad;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #3ddc84;

            box-shadow:
                0 0 10px rgba(61, 220, 132, 0.6);
        }

        .screen {
            min-height: 125px;

            padding: 18px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            margin-bottom: 18px;

            border-radius: 18px;

            background:
                linear-gradient(
                    160deg,
                    #080b10,
                    #10151d
                );

            border: 1px solid rgba(255, 255, 255, 0.06);

            overflow: hidden;
        }

        .expression {
            min-height: 24px;

            text-align: right;

            color: #747f91;

            font-size: 15px;

            margin-bottom: 8px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            text-align: right;

            font-size: 46px;
            font-weight: 300;

            padding: 0;

            letter-spacing: -1px;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 11px;
        }

        button {
            position: relative;

            height: 68px;

            border: none;
            border-radius: 16px;

            font-size: 21px;
            font-weight: 500;

            cursor: pointer;

            color: white;

            transition:
                transform 0.08s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active,
        button.pressed {
            transform: scale(0.94);
        }

        .number {
            background: #303846;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .number:hover {
            background: #3a4454;
        }

        .function {
            background: #485161;
        }

        .function:hover {
            background: #586274;
        }

        .operator {
            background:
                linear-gradient(
                    145deg,
                    #ff9f1c,
                    #ff7b00
                );

            box-shadow:
                0 7px 18px rgba(255, 125, 0, 0.18);
        }

        .operator:hover {
            box-shadow:
                0 10px 25px rgba(255, 125, 0, 0.3);
        }

        .operator.active {
            background: white;
            color: #ff8400;
        }

        .equals {
            background:
                linear-gradient(
                    145deg,
                    #36d46c,
                    #19a84b
                );

            box-shadow:
                0 7px 18px rgba(30, 190, 90, 0.2);
        }

        .equals:hover {
            box-shadow:
                0 10px 25px rgba(30, 190, 90, 0.32);
        }

        .clear {
            background:
                linear-gradient(
                    145deg,
                    #ff625e,
                    #d94343
                );
        }

        .zero {
            grid-column: span 2;
        }

        .keyboard-hint {
            color: #7c8798;

            font-size: 12px;

            text-align: center;

            line-height: 1.6;
        }

        .keyboard-hint strong {
            color: #b6bfcb;
            font-weight: 500;
        }

        @media (max-width: 450px) {

            .calculator {
                width: calc(100vw - 30px);
            }

            button {
                height: 62px;
            }

            .display {
                font-size: 40px;
            }
        }

    </style>

</head>

<body>

<div class="page">

    <div class="calculator">

        <div class="calculator-header">

            <div class="brand">
                JAVA CALC
            </div>

            <div class="status">

                <span class="status-dot"></span>

                Backend connected

            </div>

        </div>


        <div class="screen">

            <div
                id="expression"
                class="expression">
            </div>

            <input
                id="display"
                class="display"
                type="text"
                value="0"
                readonly
            >

        </div>


        <div class="buttons">

            <button
                class="clear"
                data-key="clear"
                onclick="clearCalculator()">
                AC
            </button>

            <button
                class="function"
                onclick="toggleSign()">
                ±
            </button>

            <button
                class="function"
                data-key="backspace"
                onclick="deleteNumber()">
                ⌫
            </button>

            <button
                class="operator"
                data-operation="divide"
                onclick="chooseOperation('divide', this)">
                ÷
            </button>


            <button
                class="number"
                data-number="7"
                onclick="enterNumber('7')">
                7
            </button>

            <button
                class="number"
                data-number="8"
                onclick="enterNumber('8')">
                8
            </button>

            <button
                class="number"
                data-number="9"
                onclick="enterNumber('9')">
                9
            </button>

            <button
                class="operator"
                data-operation="multiply"
                onclick="chooseOperation('multiply', this)">
                ×
            </button>


            <button
                class="number"
                data-number="4"
                onclick="enterNumber('4')">
                4
            </button>

            <button
                class="number"
                data-number="5"
                onclick="enterNumber('5')">
                5
            </button>

            <button
                class="number"
                data-number="6"
                onclick="enterNumber('6')">
                6
            </button>

            <button
                class="operator"
                data-operation="subtract"
                onclick="chooseOperation('subtract', this)">
                −
            </button>


            <button
                class="number"
                data-number="1"
                onclick="enterNumber('1')">
                1
            </button>

            <button
                class="number"
                data-number="2"
                onclick="enterNumber('2')">
                2
            </button>

            <button
                class="number"
                data-number="3"
                onclick="enterNumber('3')">
                3
            </button>

            <button
                class="operator"
                data-operation="add"
                onclick="chooseOperation('add', this)">
                +
            </button>


            <button
                class="number zero"
                data-number="0"
                onclick="enterNumber('0')">
                0
            </button>

            <button
                class="number"
                data-number="."
                onclick="enterNumber('.')">
                .
            </button>

            <button
                class="equals"
                data-key="equals"
                onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <div class="keyboard-hint">

        Keyboard enabled:
        <strong>0–9</strong>,
        <strong>Numpad</strong>,
        <strong>+ − × ÷</strong>,
        <strong>Enter</strong>,
        <strong>Backspace</strong>,
        <strong>Esc</strong>

    </div>

</div>


<script>

    const display =
        document.getElementById("display");

    const expression =
        document.getElementById("expression");


    let firstNumber = null;

    let operation = null;

    let waitingForSecondNumber = false;

    let selectedOperatorButton = null;


    const operationSymbols = {

        add: "+",

        subtract: "−",

        multiply: "×",

        divide: "÷"

    };


    function enterNumber(number) {

        if (display.value === "Error") {

            display.value = "0";

        }


        if (waitingForSecondNumber) {

            display.value =
                number === "."
                    ? "0."
                    : number;

            waitingForSecondNumber = false;

            return;
        }


        if (
            number === "." &&
            display.value.includes(".")
        ) {

            return;
        }


        if (
            display.value === "0" &&
            number !== "."
        ) {

            display.value = number;

        } else {

            display.value += number;

        }

    }


    function chooseOperation(
        selectedOperation,
        button
    ) {

        firstNumber =
            parseFloat(display.value);


        operation =
            selectedOperation;


        waitingForSecondNumber =
            true;


        expression.textContent =
            `${formatNumber(firstNumber)} ${operationSymbols[operation]}`;


        clearOperatorHighlight();


        if (button) {

            button.classList.add("active");

            selectedOperatorButton =
                button;

        }

    }


    async function calculate() {

        if (
            firstNumber === null ||
            operation === null
        ) {

            return;

        }


        const secondNumber =
            parseFloat(display.value);


        const currentExpression =
            `${formatNumber(firstNumber)} ` +
            `${operationSymbols[operation]} ` +
            `${formatNumber(secondNumber)}`;


        try {

            const response =
                await fetch(

                    `/calculate` +

                    `?a=${encodeURIComponent(firstNumber)}` +

                    `&b=${encodeURIComponent(secondNumber)}` +

                    `&operation=${encodeURIComponent(operation)}`

                );


            if (!response.ok) {

                throw new Error(
                    "Calculation failed"
                );

            }


            const result =
                await response.text();


            expression.textContent =
                `${currentExpression} =`;


            display.value =
                formatNumber(
                    parseFloat(result)
                );


            firstNumber = null;

            operation = null;

            waitingForSecondNumber = true;


            clearOperatorHighlight();

        }

        catch (error) {

            expression.textContent =
                currentExpression;


            display.value =
                "Error";


            firstNumber = null;

            operation = null;

            waitingForSecondNumber = true;


            clearOperatorHighlight();

        }

    }


    function clearCalculator() {

        display.value = "0";

        expression.textContent = "";


        firstNumber = null;

        operation = null;

        waitingForSecondNumber = false;


        clearOperatorHighlight();

    }


    function deleteNumber() {

        if (
            display.value === "Error" ||
            waitingForSecondNumber
        ) {

            display.value = "0";

            waitingForSecondNumber = false;

            return;

        }


        if (display.value.length <= 1) {

            display.value = "0";

            return;

        }


        display.value =
            display.value.slice(0, -1);

    }


    function toggleSign() {

        const number =
            parseFloat(display.value);


        if (
            Number.isNaN(number) ||
            number === 0
        ) {

            return;

        }


        display.value =
            formatNumber(
                number * -1
            );

    }


    function clearOperatorHighlight() {

        document
            .querySelectorAll(".operator")
            .forEach(button => {

                button.classList.remove(
                    "active"
                );

            });


        selectedOperatorButton = null;

    }


    function formatNumber(number) {

        if (
            !Number.isFinite(number)
        ) {

            return "Error";

        }


        if (
            Number.isInteger(number)
        ) {

            return number.toString();

        }


        return parseFloat(
            number.toFixed(10)
        ).toString();

    }


    function flashButton(selector) {

        const button =
            document.querySelector(selector);


        if (!button) {

            return;

        }


        button.classList.add("pressed");


        setTimeout(() => {

            button.classList.remove(
                "pressed"
            );

        }, 100);

    }


    function keyboardOperation(
        operation
    ) {

        const button =
            document.querySelector(
                `[data-operation="${operation}"]`
            );


        chooseOperation(
            operation,
            button
        );


        flashButton(
            `[data-operation="${operation}"]`
        );

    }


    document.addEventListener(
        "keydown",
        function(event) {

            let handled = true;


            /*
             * Numeric keypad support.
             *
             * event.code identifies the physical
             * key, so these work even when the
             * browser reports navigation keys.
             */

            if (
                event.code.startsWith(
                    "Numpad"
                )
            ) {

                const numpadMap = {

                    Numpad0: "0",
                    Numpad1: "1",
                    Numpad2: "2",
                    Numpad3: "3",
                    Numpad4: "4",
                    Numpad5: "5",
                    Numpad6: "6",
                    Numpad7: "7",
                    Numpad8: "8",
                    Numpad9: "9"

                };


                if (
                    numpadMap[event.code]
                    !== undefined
                ) {

                    const number =
                        numpadMap[event.code];


                    enterNumber(number);


                    flashButton(
                        `[data-number="${number}"]`
                    );

                }

                else if (
                    event.code ===
                    "NumpadDecimal"
                ) {

                    enterNumber(".");


                    flashButton(
                        `[data-number="."]`
                    );

                }

                else if (
                    event.code ===
                    "NumpadAdd"
                ) {

                    keyboardOperation(
                        "add"
                    );

                }

                else if (
                    event.code ===
                    "NumpadSubtract"
                ) {

                    keyboardOperation(
                        "subtract"
                    );

                }

                else if (
                    event.code ===
                    "NumpadMultiply"
                ) {

                    keyboardOperation(
                        "multiply"
                    );

                }

                else if (
                    event.code ===
                    "NumpadDivide"
                ) {

                    keyboardOperation(
                        "divide"
                    );

                }

                else if (
                    event.code ===
                    "NumpadEnter"
                ) {

                    calculate();


                    flashButton(
                        '[data-key="equals"]'
                    );

                }

                else {

                    handled = false;

                }

            }


            /*
             * Normal keyboard number row.
             */

            else if (
                /^[0-9]$/.test(
                    event.key
                )
            ) {

                enterNumber(
                    event.key
                );


                flashButton(
                    `[data-number="${event.key}"]`
                );

            }


            else if (
                event.key === "."
            ) {

                enterNumber(".");


                flashButton(
                    `[data-number="."]`
                );

            }


            else if (
                event.key === "+"
            ) {

                keyboardOperation(
                    "add"
                );

            }


            else if (
                event.key === "-"
            ) {

                keyboardOperation(
                    "subtract"
                );

            }


            else if (
                event.key === "*"
            ) {

                keyboardOperation(
                    "multiply"
                );

            }


            else if (
                event.key === "/"
            ) {

                keyboardOperation(
                    "divide"
                );

            }


            else if (
                event.key === "Enter" ||
                event.key === "="
            ) {

                calculate();


                flashButton(
                    '[data-key="equals"]'
                );

            }


            else if (
                event.key === "Backspace"
            ) {

                deleteNumber();


                flashButton(
                    '[data-key="backspace"]'
                );

            }


            else if (
                event.key === "Escape" ||
                event.key === "Delete"
            ) {

                clearCalculator();


                flashButton(
                    '[data-key="clear"]'
                );

            }


            else {

                handled = false;

            }


            if (handled) {

                event.preventDefault();

            }

        }
    );

</script>

</body>

</html>
