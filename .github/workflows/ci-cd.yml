      - name: Deploy calculator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $appDir = "C:\actions-runner\apps\java-calculator"
          $jar = Join-Path $appDir "calculator.jar"

          $sourceJar = Join-Path `
            $env:RUNNER_TEMP `
            "calculator-artifact\calculator.jar"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $appDir | Out-Null

          Write-Host "Stopping JavaCalculator..."

          Stop-ScheduledTask `
            -TaskName "JavaCalculator" `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 8082 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {

            Write-Host "Stopping remaining process on port 8082..."

            Stop-Process `
              -Id $listener.OwningProcess `
              -Force

            Start-Sleep -Seconds 2
          }

          Write-Host "Copying new calculator.jar..."

          Copy-Item `
            $sourceJar `
            $jar `
            -Force

          Write-Host "Starting JavaCalculator..."

          Start-ScheduledTask `
            -TaskName "JavaCalculator"

          $healthy = $false

          for ($i = 1; $i -le 20; $i++) {

            Start-Sleep -Seconds 2

            try {

              $response = Invoke-WebRequest `
                "http://localhost:8082" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {

                $healthy = $true
                break
              }

            }
            catch {

              Write-Host "Waiting for calculator..."
            }
          }

          if (-not $healthy) {

            Get-ScheduledTask `
              -TaskName "JavaCalculator"

            Get-ScheduledTaskInfo `
              -TaskName "JavaCalculator"

            throw "Calculator failed health check."
          }

          Write-Host "Calculator successfully deployed on port 8082."
